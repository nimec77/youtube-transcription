[project]
name = "yt-transcribe"
version = "0.1.0"
description = "Download YouTube video transcripts (captions) as plain-text files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "youtube-transcript-api>=1.0",
    "requests>=2.31",
]

[project.scripts]
yt-transcribe = "yt_transcribe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_transcribe"]
